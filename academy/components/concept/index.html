<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#edf2ff;font:14px system-ui,sans-serif}
.shell{border:1px solid #2a3855;border-radius:20px;overflow:hidden;background:linear-gradient(130deg,#14203a,#101829)}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 5px;gap:12px}.kicker{font-size:10px;letter-spacing:2px;color:#ff9a76;font-weight:800;margin:0 0 6px}h2{font-size:19px;margin:0;letter-spacing:-.3px}.live{font-size:11px;color:#90e5c9;white-space:nowrap}
.diagram{overflow-x:auto}canvas{display:block;min-width:600px;width:100%;height:auto;aspect-ratio:900/270}button,select{font:inherit;border:1px solid #40516d;border-radius:9px;background:#1d2d49;color:#edf2ff;padding:8px 13px;cursor:pointer}button:hover{border-color:#ff946e}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ff946e;outline-offset:3px}#play{background:#ff7849;color:#111827;font-weight:750;border:0;min-width:90px}.controls{display:flex;align-items:center;gap:9px;padding:0 22px 12px}input{flex:1;accent-color:#ff7849;min-width:40px}.narration{margin:0 22px 14px;min-height:44px;font-size:15px;line-height:1.55}.counter{color:#ffad8d;font-weight:750;margin-right:8px}.sql{padding:12px 22px;background:#0c1527;border-top:1px solid #263650;color:#a6b9d8;font-size:12px}.sql b{color:#7de1c1;margin-right:8px}@media(max-width:550px){.top{padding:14px}.top h2{font-size:16px}.live{display:none}.controls{padding:0 12px 12px;gap:5px}button,select{padding:7px;font-size:12px}.narration{font-size:13px;margin:0 14px 12px}}
</style></head><body>
<section class="shell" aria-label="Animated concept lesson">
<div class="top"><div><p class="kicker">SEE IT IN MOTION</p><h2 id="title">Loading concept…</h2></div><span class="live">● INTERACTIVE EXPLAINER</span></div>
<div class="diagram"><canvas id="canvas" width="1800" height="540" role="img" aria-label="Step-by-step animated diagram"></canvas></div>
<div class="controls"><button id="play" aria-label="Play animation">▶ Play</button><button id="back" aria-label="Previous step">←</button><button id="next" aria-label="Next step">→</button><input id="step" type="range" min="0" max="4" step="1" value="0" aria-label="Animation step"><select id="speed" aria-label="Animation speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<p class="narration" aria-live="polite"><span class="counter" id="counter">01 / 05</span><span id="narration"></span></p>
<div class="sql"><b>SQL CONNECTION</b><span id="sql"></span></div>
</section>
<script>
const $=id=>document.getElementById(id),c=$('canvas').getContext('2d');
const C={ink:'#edf2ff',muted:'#8da3c6',line:'#2c3d5b',orange:'#ff8759',green:'#72dfb8',blue:'#78b6ff',red:'#ff738b',purple:'#ba9aff'};
let data=null,pos=0,target=0,playing=false,last=0,elapsed=0,seenLevel=-1;
function post(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function height(){post('streamlit:setFrameHeight',{height:document.body.scrollHeight+5})}
function text(t,x,y,size=16,color=C.ink,align='left'){c.fillStyle=color;c.font=`${size>=18?'650':'500'} ${size}px system-ui`;c.textAlign=align;c.fillText(t,x,y);c.textAlign='left'}
function line(x1,y1,x2,y2,col=C.line,w=2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=w;c.stroke()}
function box(x,y,w,h,label,col=C.blue,alpha=1){c.globalAlpha=alpha;c.fillStyle=col+'18';c.strokeStyle=col;c.lineWidth=1.5;c.beginPath();c.roundRect(x,y,w,h,11);c.fill();c.stroke();if(label)text(label,x+w/2,y+h/2+5,15,col,'center');c.globalAlpha=1}
function dot(x,y,r,col){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=col;c.fill()}
function arrow(x,y,xx,yy,col=C.green){line(x,y,xx,yy,col,2);let a=Math.atan2(yy-y,xx-x);c.beginPath();c.moveTo(xx,yy);c.lineTo(xx-9*Math.cos(a-.5),yy-9*Math.sin(a-.5));c.lineTo(xx-9*Math.cos(a+.5),yy-9*Math.sin(a+.5));c.closePath();c.fillStyle=col;c.fill()}
function graph(values,x,y,w,h,col,portion=1){line(x,y+h,x+w,y+h);line(x,y,x,y+h);const max=Math.max(...values)*1.15;let n=Math.max(1,Math.min(values.length,Math.floor(values.length*portion)));c.beginPath();for(let i=0;i<n;i++){const xx=x+i*w/(values.length-1),yy=y+h-values[i]/max*h;i?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.strokeStyle=col;c.lineWidth=3;c.stroke();for(let i=0;i<n;i++)dot(x+i*w/(values.length-1),y+h-values[i]/max*h,4,col)}
function draw(){c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,900,270);if(!data)return;let p=pos,s=Math.floor(p+.05),f=Math.min(1,p/4);const kind=data.kind;
if(kind==='series'){text('active sessions',58,30,13,C.muted);graph([9,12,10,16,19,17,22,25,24],65,50,740,150,C.orange,.15+f*.85);if(p>2.5)graph([5,8,7,9,8,13,12,15,17],65,50,740,150,C.blue,(p-2.5)/1.5);text('time →',790,226,13,C.muted);box(86,226,170,30,'instance = a',C.orange);box(275,226,170,30,'instance = b',C.blue);if(p>3.2){line(805,42,805,208,C.green,2);text('evaluation time',800,34,12,C.green,'right')}}
else if(kind==='filter'){let names=['api / a','web / a','api / b','web / b'];text('ALL SERIES',95,34,12,C.muted);text('MATCHER',380,34,12,C.muted);text('RESULT',665,34,12,C.green);names.forEach((n,i)=>{let yes=i%2===0;box(70,50+i*47,175,36,n,yes?C.orange:C.blue,p>1&&!yes?.3:1);if(p>1&&yes){arrow(251,68+i*47,355,68+i*47);if(p>2)box(655,70+(i/2)*90,180,46,n,C.green)}});box(355,91,240,64,'service = "api"',C.orange);if(p>2)arrow(603,123,647,123)}
else if(kind==='types'){text('COUNTER: requests since restart',70,35,16,C.orange);text('GAUGE: current queue depth',510,35,16,C.blue);graph([5,12,18,26,34,2,8,17,26],70,55,335,145,C.orange,.2+f*.8);graph([9,16,11,7,13,18,12,15,8],510,55,315,145,C.blue,.2+f*.8);text('reset ↓',263,78,14,C.red);text('Cumulative events',235,235,16,C.orange,'center');text('Can rise or fall',667,235,16,C.blue,'center')}
else if(kind==='aggregate'){const v=[10,13,6,9];text('INSTANCE VALUES',72,32,12,C.muted);text('GROUP BY SERVICE',590,32,12,C.green);v.forEach((n,i)=>{let api=i<2,progress=Math.max(0,Math.min(1,(p-1)/2));let x=70+progress*390,y=50+i*44+progress*((api?90:180)-(50+i*44));box(x,y,150,34,(api?'api':'web')+' / '+(i%2?'b':'a')+'  = '+n,api?C.orange:C.blue,1-progress*.65)});box(635,66,175,64,'api  →  '+Math.round(23*f),C.orange);box(635,162,175,64,'web  →  '+Math.round(15*f),C.blue);if(p>2)text('23 = 10 + 13       15 = 6 + 9',440,251,15,C.green,'center')}
else if(kind==='rate'){graph([30,45,5,20],70,40,485,160,C.orange,.25+f*.75);['0s','30s','60s','90s'].forEach((v,i)=>text(v,70+i*161.7,224,13,C.muted,'center'));if(p>1)text('restart ↓',392,59,15,C.red);box(605,50,245,72,p<3?'45 → 5 is a reset':'+15 +5 +15 = 35',p<3?C.red:C.green);if(p>2)box(605,141,245,67,'35 / 90 ≈ 0.389 /s',C.green);text('Sample-delta illustration; rate() also extrapolates.',70,258,13,C.muted)}
else if(kind==='ratio'){text('100 REQUESTS',88,32,13,C.muted);for(let i=0;i<100;i++){let shown=i<Math.ceil((.2+f*.8)*100);dot(95+(i%20)*25,62+Math.floor(i/20)*33,8,shown?(p>1&&i<8?C.red:C.blue):C.line)}box(643,72,195,83,p<3?'8 errors / 100':'0.08 = 8%',p<3?C.red:C.green);text('Same service. Same window.',641,185,15,C.muted);text('Never average unweighted instance percentages.',89,255,14,C.muted)}
else if(kind==='window'){const vals=Array.from({length:31},(_,i)=>10+7*Math.sin(i/3));graph(vals,65,38,760,157,C.blue);const end=Math.floor(10+f*20),start=end-10;let xx=65+start*760/30;c.fillStyle='#72dfb822';c.fillRect(xx,35,760/3,165);line(xx,35,xx,200,C.green);line(xx+760/3,35,xx+760/3,200,C.green);text('5-minute window',xx+126,26,14,C.green,'center');for(let i=start+1;i<=end;i++)dot(65+i*760/30,195-vals[i]/(Math.max(...vals)*1.15)*157,5,C.green);text('Excluded left boundary',xx,225,12,C.muted);text('Included right boundary',Math.min(680,xx+170),245,12,C.green);text('time →',780,220,13,C.muted)}
else if(kind==='matching'){text('MEASUREMENTS',80,30,12,C.muted);text('UNIQUE METADATA',580,30,12,C.muted);['api / a','api / b','web / a','web / b'].forEach((x,i)=>{box(65,44+i*49,175,38,x,i<2?C.orange:C.blue);if(p>1+(i>=2?1:0))arrow(248,63+i*49,570,i<2?95:192,i<2?C.orange:C.blue)});box(575,68,252,54,'api → team: platform',C.orange);box(575,164,252,54,'web → team: experience',C.blue);if(p>2.8)box(299,107,206,42,'on(service)',C.green);text('group_left(team) copies the team label',70,258,14,C.green)}
else if(kind==='histogram'){const counts=[1,2,3,5,5],labels=['≤0.1s','≤0.25s','≤0.5s','≤1.0s','+Inf'];text('CUMULATIVE OBSERVATIONS',70,30,12,C.muted);counts.forEach((n,i)=>{let h=n*28*(.1+f*.9),x=95+i*150;c.fillStyle=i===3&&p>2?C.orange:C.blue;c.beginPath();c.roundRect(x,205-h,90,h,6);c.fill();text(String(Math.round(n*(.1+f*.9))),x+45,194-h,18,C.ink,'center');text(labels[i],x+45,230,15,C.muted,'center')});if(p>2){line(72,72,829,72,C.green,2);text('95% rank → estimate inside the bucket',78,56,14,C.green)}}
else if(kind==='alert'){text('TARGET OBSERVATIONS: THREE DISTINCT CASES',55,29,12,C.muted);['Healthy: up = 1','Failed: up = 0','Missing: absent'].forEach((label,i)=>box(55+i*277,44,235,48,label,[C.green,C.red,C.muted][i],p>=i?1:.3));text('ALERT STATE: WHEN A CHOSEN CONDITION HOLDS',55,129,12,C.muted);box(110,149,230,56,'Pending: timer started',C.orange,p>=3?1:.25);arrow(356,177,539,177,p>=4?C.green:C.line);text('hold duration',450,160,12,C.muted,'center');box(559,149,230,56,'Firing: still true',C.red,p>=4?1:.25);text('A missing series does not automatically become a pending alert.',450,246,14,C.muted,'center')}
else if(kind==='incident'){const names=['TRAFFIC','ERROR FRACTION','P95 LATENCY','FAILED TARGETS'];const values=[Math.round(34+68*f)+' /s',(1+7*f).toFixed(1)+'%',(.44+.44*f).toFixed(2)+'s',p>2?'1':'0'];names.forEach((name,i)=>{let x=35+i*221;box(x,54,198,128,'',i===0?C.blue:p>2?C.red:C.green);text(name,x+99,87,11,C.muted,'center');text(values[i],x+99,137,32,i===0?C.blue:p>2?C.red:C.green,'center')});text(p>2?'Incident: combine errors, latency, traffic, and availability.':'Baseline: establish the normal before interpreting change.',450,230,16,C.ink,'center')}
}
function update(){const s=Math.round(target);$('step').value=s;$('counter').textContent=String(s+1).padStart(2,'0')+' / 05';$('narration').textContent=data.steps[s];$('play').textContent=playing?'Ⅱ Pause':'▶ Play';$('play').setAttribute('aria-label',playing?'Pause animation':'Play animation');$('canvas').setAttribute('aria-label',data.title+'. '+data.steps[s]);height()}
function frame(t){let dt=Math.min(80,t-last||16);last=t;pos=window.matchMedia('(prefers-reduced-motion: reduce)').matches?target:pos+(target-pos)*Math.min(1,dt/140);if(playing){elapsed+=dt*Number($('speed').value);if(elapsed>2200){elapsed=0;if(target<4)target++;else playing=false;update()}}draw();requestAnimationFrame(frame)}
$('play').onclick=()=>{if(!data)return;playing=!playing;if(playing&&target===4){target=0;pos=0}elapsed=0;update()};$('back').onclick=()=>{playing=false;target=Math.max(0,target-1);update()};$('next').onclick=()=>{playing=false;target=Math.min(4,target+1);update()};$('step').oninput=e=>{playing=false;target=Number(e.target.value);update()};
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data.type!=='streamlit:render')return;data=e.data.args.animation;if(seenLevel!==e.data.args.level){seenLevel=e.data.args.level;pos=0;target=0;playing=false}$('title').textContent=data.title;$('sql').textContent=data.sql;update()});
window.addEventListener('resize',height);post('streamlit:componentReady',{apiVersion:1});height();requestAnimationFrame(frame);
</script></body></html>
