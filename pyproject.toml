[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "promql-zero-to-hero"
version = "2.0.0"
description = "A beginner-friendly animated PromQL academy with optional SQL comparisons, real query labs, and a grounded tutor."
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.64,<2", "pandas>=2.2,<4", "plotly>=6,<7",
  "duckdb>=1.4,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1",
  "langgraph>=1,<2", "langchain-core>=1,<2", "langsmith>=0.4,<1",
  "rank-bm25>=0.2,<1", "scikit-learn>=1.6,<2", "sqlglot>=27,<31",
  "beautifulsoup4>=4.13,<5", "python-dotenv>=1,<2", "pyarrow>=17,<24", "Authlib>=1.6,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
embeddings = ["chromadb>=1,<2", "sentence-transformers>=5,<6"]
training = ["transformers>=4.51,<5", "torch>=2.5,<3", "peft>=0.15,<1", "accelerate>=1,<2"]

[tool.setuptools.packages.find]
include = ["academy*"]

[tool.setuptools.package-data]
academy = ["components/concept/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
